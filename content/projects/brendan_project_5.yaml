title: "NFL Prediction & Fantasy Model"

short_summary: >
  A validated NFL prediction system built on real 2015-2025 data: game
  spread predictions, season win projections, fantasy player rankings, and
  playoff probabilities, each backtested against real historical outcomes.
  Elo-based season win projections reached +0.977 correlation by Week 16
  of 2025.

tech_stack:
  - Python
  - pandas
  - scikit-learn
  - SQLite
  - React

problem_statement: >
  Most sports prediction projects never get checked against real outcomes,
  so it is hard to know whether a model actually works. This project set out
  to build NFL predictions that could be validated honestly, including
  reporting where the model loses to the Vegas line.

approach: >
  Built two prediction tracks on nflverse data: an EPA-based pipeline and
  an Elo pipeline with team and QB Elo ratings, weekly recalibration, and
  matchup adjustments. Compared both against Vegas lines with leave-one-out
  cross-validation for blend weights, and built a Monte Carlo playoff
  simulator over the real 7-team-per-conference structure plus a fantasy
  ranking system. Results are tracked weekly in SQLite and shown in a
  React dashboard.

results_impact: >
  Elo beat EPA at both the season-win and game-spread level. Season win
  projections reached +0.977 correlation by Week 16 of 2025, and fantasy
  rankings reached +0.651 correlation for running backs on real 2025 PPR
  data. The honest headline finding: Vegas beat every model blend tested,
  and several adjustments that looked promising tested null and were left
  out rather than kept.

